name: Build jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set active Minecraft version
        run: ./gradlew "Set active project to 26.2-fabric" --no-daemon

      - name: Build
        run: ./gradlew :26.2-fabric:build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: spatial-gui-jar
          path: |
            versions/26.2-fabric/build/libs/*.jar
            !versions/26.2-fabric/build/libs/*-sources.jar
            !versions/26.2-fabric/build/libs/*-dev.jar
